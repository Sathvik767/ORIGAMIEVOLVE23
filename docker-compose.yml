# `docker compose up -d`                 -> MongoDB + Redis only (run API/frontend on the host)
# `docker compose --profile full up -d`  -> also API, workers, and beat (required on Windows:
#                                           Celery workers do not run natively there)
# Optimization concurrency (default 2): ORIGAMI_OPTIMIZE_CONCURRENCY in .env
name: origami-evolve

x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    ORIGAMI_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    ORIGAMI_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ORIGAMI_STORAGE_ROOT: /data
  volumes:
    - storage-data:/data
    # Optional external tools (read-only). Empty unless you put them there; see tools/*/README.md.
    - ./tools/oxdna:/opt/oxdna:ro
    - ./tools/tacoxdna:/opt/tacoxdna:ro
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  profiles: ["full"]

services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
    ports: ["127.0.0.1:27017:27017"]   # localhost only
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]     # localhost only
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-ingest:
    <<: *app
    command: ["celery", "-A", "origami_worker.celery_app", "worker", "-Q", "ingest,maintenance",
              "--concurrency", "${INGEST_CONCURRENCY:-2}", "-n", "ingest@%h", "--loglevel", "INFO"]
    healthcheck:  # this worker's own node answers a ping through the broker
      test: ["CMD-SHELL", "celery -A origami_worker.celery_app inspect ping -d ingest@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  worker-optimize:
    <<: *app
    command: ["celery", "-A", "origami_worker.celery_app", "worker", "-Q", "optimize",
              "--concurrency", "${ORIGAMI_OPTIMIZE_CONCURRENCY:-2}", "-n", "optimize@%h", "--loglevel", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A origami_worker.celery_app inspect ping -d optimize@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  beat:
    <<: *app
    command: ["celery", "-A", "origami_worker.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/data/celerybeat-schedule"]

volumes:
  mongo-data:
  redis-data:
  storage-data:
